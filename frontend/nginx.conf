server {
    # Listen for incoming HTTP traffic on standard port 80
    listen 80;

    # =========================================
    # FRONTEND ROUTING (Static Web Assets)
    # =========================================
    location / {
        # Directory inside the container where static files (HTML, CSS, JS) live
        root /usr/share/nginx/html;

        # Default files to serve if the user requests the root URL the one the user can access before they can auth.
        index index.html home.html;

        # Fallback mechanism: attempts to serve the exact requested file ($uri), 
        # then a directory ($uri/), and if neither exists, redirects to /index.html
        try_files $uri $uri/ /index.html;
    }

    # =========================================
    # BACKEND API REVERSE PROXY
    # =========================================
    location /api/ {
        # Proxies/forwards all incoming requests starting with /api/ 
        # to the Flask backend container on port 5000 via Docker internal DNS
        proxy_pass http://backend:5000;

        # Forwards the original Host header sent by the client browser
        proxy_set_header Host $host;

        # Passes the actual client's IP address to the backend (used by app.py for IP limits)
        proxy_set_header X-Real-IP $remote_addr;

        # Appends the client IP to a chain of proxies to maintain the original connection origin
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}