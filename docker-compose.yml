version: '3.8'

services:
  # Container 1: Frontend Web Server & Reverse Proxy
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pulse_network

  # Container 2: Backend API
  backend:
    build: ./backend
    expose:
      - "5000"
    environment:
      - DB_HOST=db
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=my_website_db
    depends_on:
      - db
    networks:
      - pulse_network

  # Container 3: MySQL Database
  db:
    image: mysql:8.2
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=my_website_db
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pulse_network

  # Container 4: Adminer GUI
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - pulse_network

# Persistent storage volume for the database
volumes:
  db_data:

# Private bridge network for container isolation
networks:
  pulse_network:
    driver: bridge